<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Слайдуша">
  <!-- Знак бренда: звезда без плашки, как на лендингах.
       Нарисована контуром, а не символом ✦: в иконке нет шрифта,
       и глиф отрисовался бы по-разному в разных системах.
       Цвет на полтона светлее брендовой терракоты (#B4502A): он
       единственный держит 3:1 и на светлой полосе вкладок, и на
       тёмной, и на бумаге сайта — фон у иконки не под нашим
       контролем. «Талия» выбрана по проверке на 16 пикселях:
       уже — звезда становится хилой, шире — заплывает. -->
  <path d="M32 2 Q35.6 28.4 62 32 Q35.6 35.6 32 62 Q28.4 35.6 2 32 Q28.4 28.4 32 2 Z" fill="#C2582D"/>
</svg>
