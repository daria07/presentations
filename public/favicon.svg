  <rect x="27" y="22" width="15" height="4.5" rx="2.25" fill="#B4502A"/>
  <rect x="27" y="32" width="19" height="2.6" rx="1.3" fill="#C9BDB4"/>
  <rect x="27" y="39" width="12" height="2.6" rx="1.3" fill="#C9BDB4"/>
