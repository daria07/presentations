# Выкладка на боевой сервер из GitHub Actions — СЕЙЧАС НЕ ИСПОЛЬЗУЕТСЯ.
#
# После переезда на VDSina подключения от серверов GitHub (они за
# рубежом) до нашего сервера не доходят: ssh падает по таймауту.
# Поэтому деплоим с Mac: bash deploy/remote.sh (см. DEPLOY.md, раздел 15).
#
# Автозапуск после тестов выключен, осталась только ручная кнопка
# «Run workflow» — на случай, если сервер снова станет доступен снаружи.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://slaidusha.ru

    steps:
      - name: Подключаем ключ
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Выкладываем
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            'cd /var/www/slaidusha/repo && git pull --ff-only && bash deploy/deploy.sh'

      - name: Проверяем, что сайт поднялся
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://slaidusha.ru/up || true)
            if [ "$code" = "200" ]; then
              echo "Сайт отвечает"
              exit 0
            fi
            echo "Попытка $i: ответ $code, ждём"
            sleep 6
          done
          echo "Сайт не ответил 200 за минуту"
          exit 1
