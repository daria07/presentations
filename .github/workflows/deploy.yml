# Выкладка на боевой сервер.
#
# Запускается сама после зелёной сборки в main и вручную кнопкой
# «Run workflow». Руками на сервер заходить больше не нужно: всё, что
# раньше делалось через ssh и bash deploy/deploy.sh, делает этот файл.
name: deploy

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Две выкладки одновременно — это гонка за один и тот же каталог на
# сервере. Вторая ждёт, пока закончится первая.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Раннер стоит на самом сервере и сам ходит в GitHub за заданиями:
    # входящие подключения из-за рубежа до сервера не доходят, а
    # исходящие к GitHub работают. Поэтому без ssh — всё выполняется
    # прямо на сервере от пользователя deploy. Установка: DEPLOY.md.
    runs-on: [self-hosted, slaidusha]

    # Красная сборка на сервер не едет. Кнопка «Run workflow» этой
    # проверки не касается — ей веришь ты сама.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: https://slaidusha.ru

    env:
      # У сервера нет IPv6: без этого сборка падает на скачивании шрифтов
      NODE_OPTIONS: --dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=5000

    steps:
      - name: Выкладываем
        run: |
          set -e
          cd /var/www/slaidusha/repo
          git pull --ff-only
          bash deploy/deploy.sh

      - name: Проверяем, что сайт поднялся
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --resolve slaidusha.ru:443:127.0.0.1 https://slaidusha.ru/up || true)
            if [ "$code" = "200" ]; then
              echo "Сайт отвечает"
              exit 0
            fi
            echo "Попытка $i: ответ $code, ждём"
            sleep 6
          done
          echo "Сайт не ответил 200 за минуту"
          exit 1
