# /etc/nginx/sites-available/default-deny
#
# Заглушка для запросов с чужим или пустым доменом. Боты стучатся по
# IP и с посторонними Host — без этого блока они попадают в наш сайт,
# засоряя логи и статистику. 444 — специальный код nginx: закрыть
# соединение молча, не тратя ответ.
#
# Установка:
#   cp deploy/nginx-default.conf /etc/nginx/sites-available/default-deny
#   ln -sf /etc/nginx/sites-available/default-deny /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Сертификат нужен формально: без него nginx не поднимет ssl-блок.
    # Берём наш — посторонним всё равно прилетит 444 вместо ответа.
    ssl_certificate     /etc/letsencrypt/live/slaidusha.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slaidusha.ru/privkey.pem;

    return 444;
}
