# /etc/fail2ban/jail.d/slaidusha.conf
#
# sshd-блок включён в fail2ban по умолчанию, здесь добавляем защиту
# веб-части: сканеры, которые ломятся в .env и .git, и перебор входа.
#
#   cp deploy/fail2ban-nginx.conf /etc/fail2ban/jail.d/slaidusha.conf
#   systemctl restart fail2ban && fail2ban-client status

[sshd]
enabled = true
maxretry = 5
bantime = 1h

# Сканеры чужих файлов: /.env, /.git/config, /wp-login.php и подобное.
# В логе они оседают как "access forbidden by rule" и 404.
[nginx-botsearch]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/slaidusha.error.log
maxretry = 10
findtime = 10m
bantime  = 24h
