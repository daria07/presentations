; /etc/supervisor/conf.d/slaidusha-worker.conf
;
; Воркер держит в памяти загруженный код, поэтому после каждого деплоя
; ему нужен queue:restart — он есть в deploy.sh.
;
; Установка:
;   supervisorctl reread && supervisorctl update && supervisorctl status

[program:slaidusha-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/slaidusha/artisan queue:work --queue=default --sleep=3 --tries=2 --max-time=3600 --timeout=300
directory=/var/www/slaidusha
autostart=true
autorestart=true
user=deploy
; Две генерации одновременно: печать PDF через Chrome съедает память,
; на сервере с 2 ГБ больше двух процессов держать нельзя
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/slaidusha/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; Даём воркеру закончить текущую генерацию, а не рвать её на середине
stopwaitsecs=330
