# /etc/nginx/sites-available/slaidusha
#
# Файл рабочий сразу, без сертификата: здесь только http. TLS дописывает
# certbot — он создаст рядом блок на 443 со всеми настройками отсюда
# и поставит редирект с 80. Поэтому запускать так:
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/slaidusha
#   ln -sf /etc/nginx/sites-available/slaidusha /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d slaidusha.ru -d www.slaidusha.ru

server {
    listen 80;
    listen [::]:80;
    server_name slaidusha.ru www.slaidusha.ru;

    root /var/www/slaidusha/public;
    index index.php;

    charset utf-8;
    client_max_body_size 8m;

    # Генерация идёт в очереди, но страница статуса и печать PDF
    # изредка держат запрос дольше обычного
    fastcgi_read_timeout 120s;

    # Inertia отдаёт крупные заголовки (сессия, флеш-сообщения), и
    # дефолтных 8 КБ не хватает: nginx рвёт ответ с «too big header»
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 32k;
    fastcgi_busy_buffers_size 64k;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Имена собранных файлов хэшированы, поэтому кэшируем надолго
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/slaidusha.access.log;
    error_log  /var/log/nginx/slaidusha.error.log;
}
