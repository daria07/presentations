# /etc/nginx/sites-available/slaidusha
# Ссылку поставить в sites-enabled, сертификат выпустить certbot'ом:
#   certbot --nginx -d slaidusha.ru -d www.slaidusha.ru

server {
    listen 80;
    listen [::]:80;
    server_name slaidusha.ru www.slaidusha.ru;

    # Единственная задача — отдать всё на https, certbot допишет сюда сам
    return 301 https://slaidusha.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.slaidusha.ru;
    return 301 https://slaidusha.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name slaidusha.ru;

    root /var/www/slaidusha/public;
    index index.php;

    charset utf-8;
    client_max_body_size 8m;

    # Генерация занимает до минуты, но фронт опрашивает статус отдельными
    # запросами, поэтому таймауты нужны умеренные
    fastcgi_read_timeout 120s;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Собранные Vite ассеты и шрифты — с длинным кэшем, имена файлов хэшированы
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/slaidusha.access.log;
    error_log  /var/log/nginx/slaidusha.error.log;
}
